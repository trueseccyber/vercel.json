
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Live Player Counter</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.counter {
  width: 100%;
  max-width: 440px;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid #a75012;
  background: linear-gradient(135deg, #211811, #111111);
  max-width: none;
  min-height: 100vh;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.heading {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: #ff912e;
  border-radius: 50%;
  margin-right: 7px;
}

.status {
  font-size: 11px;
  font-weight: 800;
  color: #4ade80;
}

.players {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 15px;
}

#current {
  font-size: 42px;
  font-weight: 900;
  color: #ff9739;
}

#maximum {
  font-size: 15px;
  color: #aaaaaa;
}

.track {
  height: 8px;
  background: #44301e;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
}

#bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff7619, #ffc166);
  border-radius: 20px;
  transition: width 0.5s ease;
}

.footer {
  margin-top: 12px;
  font-size: 11px;
  color: #aaaaaa;
}
</style>
</head>

<body>

<div class="counter">
  <div class="top">
    <div class="heading">
      <span class="dot"></span>LIVE SERVER STATUS
    </div>
    <div id="status" class="status">LOADING</div>
  </div>

  <div class="players">
    <span id="current">--</span>
    <span id="maximum">/ -- players</span>
  </div>

  <div class="track">
    <div id="bar"></div>
  </div>

  <div class="footer">
    Automatically updates every 30 seconds
  </div>
</div>

<script>
async function updatePlayers() {
  const status = document.getElementById("status");
  const current = document.getElementById("current");
  const maximum = document.getElementById("maximum");
  const bar = document.getElementById("bar");

  try {
    const response = await fetch("/api/status", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Status unavailable");
    }

    const data = await response.json();

    const players = Number(data.players) || 0;
    const max = Number(data.maxPlayers) || 0;

    current.textContent = data.online ? players : 0;
    maximum.textContent = "/ " + (max || "?") + " players";

    if (data.online) {
      status.textContent = "ONLINE";
      status.style.color = "#4ade80";
    } else {
      status.textContent = "OFFLINE";
      status.style.color = "#f87171";
    }

    const percentage = max > 0
      ? Math.min(100, players / max * 100)
      : 0;

    bar.style.width = data.online
      ? percentage + "%"
      : "0%";

  } catch (error) {
    status.textContent = "UNAVAILABLE";
    status.style.color = "#fbbf24";
    current.textContent = "--";
    maximum.textContent = "/ -- players";
    bar.style.width = "0%";
  }
}

updatePlayers();
setInterval(updatePlayers, 30000);
</script>

</body>
</html>
